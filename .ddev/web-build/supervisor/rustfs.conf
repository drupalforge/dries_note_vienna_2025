[program:rustfs]
command=rustfs --address 127.0.0.1:9000
user=%(ENV_DDEV_USER)s
autostart=false
autorestart=true
stdout_logfile=/var/log/rustfs.out.log
stderr_logfile=/var/log/rustfs.err.log
environment=RUSTFS_ACCESS_KEY="minioadmin",RUSTFS_SECRET_KEY="minioadmin",RUSTFS_VOLUMES="%(ENV_APP_ROOT)s/.devpanel/milvus/volumes/rustfs",RUSTFS_CONSOLE_ENABLE="false"
dependent_startup=true
