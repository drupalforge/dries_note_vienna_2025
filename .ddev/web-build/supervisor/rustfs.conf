[program:rustfs]
command=/usr/bin/rustfs
user=%(ENV_DDEV_USER)s
autostart=false
autorestart=true
stdout_logfile=/var/log/rustfs.out.log
stderr_logfile=/var/log/rustfs.err.log
environment=RUSTFS_ADDRESS=":9000",RUSTFS_CONSOLE_ADDRESS=":9001",RUSTFS_CONSOLE_ENABLE="true",RUSTFS_ACCESS_KEY="rustfsadmin",RUSTFS_SECRET_KEY="rustfsadmin",RUSTFS_VOLUMES="%(ENV_APP_ROOT)s/.devpanel/milvus/volumes/rustfs",RUSTFS_UNSAFE_BYPASS_DISK_CHECK="true"
dependent_startup=true
