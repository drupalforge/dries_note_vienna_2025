---
name: Docker build and push template
"on":
  push:
    branches:
      - "main"
  schedule:
    - cron: '0 11 * * 0'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
  packages: write
jobs:
  build-application:
    uses: >-
      drupalforge/docker_publish_action/.github/workflows/docker-publish.yml@main
    with:
      dockerhub_username: ${{ vars.DOCKERHUB_USERNAME }}
      base_image: devpanel/php:8.4-base
      max_parallel: 1
    secrets:
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
      init_env: >-
        ${{ format('{{"OPENAI_KEY":{0}}}',
        toJSON(secrets.OPENAI_KEY)) }}
